# /etc/fail2ban/filter.d/marche-sondes.conf — les sondes de scanners sur Marché
#
# Constat de l'enquête du 14 septembre : le filtre fourni nginx-botsearch ne reconnaît que
# 9 des 42 sondes du scanner (il ne connaît ni /.env, ni /.git/config, ni /backup.sql…).
# Or un client légitime de Marché n'obtient de 404 que sur l'API (/api/orders/<id> inconnu).
# Règle : un 404 HORS de /api/ est une sonde.
[Definition]
# fail2ban retire la date de la ligne avant d'appliquer la regex : il reste « [] »
failregex = ^<HOST> \S+ \S+ \[\] "[A-Z]+ (?!/api/)\S+ [^"]*" 404 
ignoreregex =
