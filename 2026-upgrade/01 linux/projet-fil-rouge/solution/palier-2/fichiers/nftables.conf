#!/usr/sbin/nft -f
# /etc/nftables.conf — pare-feu de web1 (Palier 2 : nftables directement, ufw désactivé)
#
# PAS de « flush ruleset » : il effacerait AUSSI les tables des autres outils (fail2ban
# ajoute la sienne). On ne recrée que NOTRE table : la déclarer vide puis la supprimer
# évite l'erreur « No such file or directory » si elle n'existe pas encore.
table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority filter; policy drop;

        iif lo accept                                   # la machine se parle à elle-même
        ct state established,related accept            # les réponses à ce qu'on a initié
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept         # ping, et surtout ICMPv6 (indispensable en IPv6)

        tcp dport 22 ct state new limit rate 15/minute burst 30 packets accept
        tcp dport { 80, 443 } accept

        limit rate 5/minute log prefix "nft-refuse: " level info
        counter comment "paquets refusés"
    }

    chain transfert {
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        type filter hook output priority filter; policy accept;
    }
}
