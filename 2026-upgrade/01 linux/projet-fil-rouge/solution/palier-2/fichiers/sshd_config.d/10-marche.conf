# /etc/ssh/sshd_config.d/10-marche.conf — Palier 2
# « 10- » : lu AVANT 60-cloudimg-settings.conf ; la PREMIÈRE valeur rencontrée gagne.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Seuls les membres de ce groupe peuvent se connecter (administrateurs + deploy)
AllowGroups ssh-autorises
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
