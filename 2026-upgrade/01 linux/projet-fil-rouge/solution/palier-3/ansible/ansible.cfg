# Solution de référence — Palier 3. À lancer depuis ctl, dans ce dossier :
#   ansible-playbook site.yml
[defaults]
inventory = inventaire.ini
remote_user = ubuntu
# Mot de passe du coffre (vault) : fichier hors du dépôt Git dans la vraie vie. Ici, lab.
vault_password_file = .vault-pass
interpreter_python = auto_silent
forks = 10
# Les machines de lab sont détruites et recréées (plan de reprise) : leur clé d'hôte SSH
# change à chaque fois. On accepte une clé NOUVELLE, jamais une clé DIFFÉRENTE d'une clé connue
# (après une recréation : ssh-keygen -R <ip>, geste conscient).
host_key_checking = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
# Les modules passent par l'entrée standard au lieu de fichiers temporaires : plus rapide, et
# évite l'erreur des fichiers temporaires quand on devient un utilisateur non privilégié (postgres).
pipelining = True
