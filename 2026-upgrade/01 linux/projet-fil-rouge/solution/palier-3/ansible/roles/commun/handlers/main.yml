---
- name: Recharger ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Redémarrer fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Redémarrer journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
