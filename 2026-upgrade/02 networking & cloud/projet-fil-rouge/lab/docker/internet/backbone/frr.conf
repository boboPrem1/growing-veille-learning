! TransAtlantique — AS 65010 : l'opérateur de transit du lab (le câble Lomé ↔ Europe).
! Ses clients : Marché (AS 64500, dans les deux régions) et TogoNet (AS 65030, le FAI de Lomé).
! Son pair : OuestNet (AS 65020), un autre transitaire, en peering sans règlement (settlement-free).
! Comme un vrai transitaire, il FILTRE ce que ses clients annoncent (liste de préfixes tirée du
! registre — l'IRR), limite leur nombre, et n'envoie à son pair que ses propres routes et celles de
! ses clients : jamais celles apprises d'un autre pair (sinon il transporterait gratuitement le
! trafic des autres : une « fuite de routes »).
frr version 8.4
frr defaults traditional
hostname transit-a
log syslog informational
service integrated-vtysh-config
!
! --- ce que chaque client a le droit d'annoncer (l'IRR)
ip prefix-list MARCHE-AGREGATS seq 5 permit 198.51.100.0/24 le 26
ip prefix-list MARCHE-HOTES seq 5 permit 198.51.100.0/24 ge 32
ip prefix-list TOGONET seq 5 permit 198.18.30.0/24
ip prefix-list NOS-RESEAUX seq 5 permit 192.0.2.0/24
ip prefix-list NOS-RESEAUX seq 10 permit 203.0.113.0/24
!
! --- RTBH (Remote Triggered Black Hole) : un client attaqué annonce l'adresse visée en /32 avec la
! communauté 65010:666 ; le transitaire JETTE ce trafic à sa frontière, avant qu'il ne sature le lien.
bgp community-list standard TROU-NOIR seq 5 permit 65010:666
! (le next-hop 198.18.254.2 est sur l'interface de rejet « trou-noir » : tout ce qui y part disparaît.
!  Pas une route « blackhole » : FRR ne résout pas un next-hop à travers elle — la route resterait
!  inactive, et le trafic passerait. Vécu.)
!
route-map DEPUIS-MARCHE permit 10
 match ip address prefix-list MARCHE-HOTES
 match community TROU-NOIR
 set ip next-hop 198.18.254.2
 set community no-export additive
exit
route-map DEPUIS-MARCHE permit 20
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map DEPUIS-MARCHE deny 30
exit
!
route-map DEPUIS-TOGONET permit 10
 match ip address prefix-list TOGONET
exit
route-map DEPUIS-TOGONET deny 20
exit
!
! à un client : toute la table (il est venu pour ça)
route-map VERS-CLIENT permit 10
exit
!
! d'un pair : ses routes, pas les nôtres ni celles de nos clients revenues par lui
route-map DEPUIS-PAIR deny 5
 match ip address prefix-list NOS-RESEAUX
exit
route-map DEPUIS-PAIR deny 6
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map DEPUIS-PAIR permit 10
exit
!
! à un pair : nos réseaux et ceux de nos clients — JAMAIS ce qu'un autre pair nous a appris
route-map VERS-PAIR permit 10
 match ip address prefix-list NOS-RESEAUX
exit
route-map VERS-PAIR permit 20
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map VERS-PAIR permit 30
 match ip address prefix-list TOGONET
exit
route-map VERS-PAIR deny 40
exit
!
router bgp 65010
 bgp router-id 203.0.113.1
 bgp log-neighbor-changes
 neighbor MARCHE peer-group
 neighbor MARCHE remote-as 64500
 neighbor MARCHE description client Marché
 neighbor 203.0.113.10 peer-group MARCHE
 neighbor 192.0.2.100 peer-group MARCHE
 neighbor 192.0.2.2 remote-as 65030
 neighbor 192.0.2.2 description client TogoNet
 neighbor 198.18.0.2 remote-as 65020
 neighbor 198.18.0.2 description pair OuestNet
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  network 203.0.113.0/24
  neighbor MARCHE route-map DEPUIS-MARCHE in
  neighbor MARCHE route-map VERS-CLIENT out
  neighbor MARCHE maximum-prefix 20
  neighbor MARCHE send-community
  ! (on garde ce que le client annonce AVANT filtrage : pour voir, et prouver, ce qu'il envoie vraiment)
  neighbor MARCHE soft-reconfiguration inbound
  neighbor 192.0.2.2 route-map DEPUIS-TOGONET in
  neighbor 192.0.2.2 route-map VERS-CLIENT out
  neighbor 192.0.2.2 maximum-prefix 10
  neighbor 198.18.0.2 route-map DEPUIS-PAIR in
  neighbor 198.18.0.2 route-map VERS-PAIR out
 exit-address-family
exit
!
