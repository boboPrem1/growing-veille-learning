// BIND « de l'Internet » : deux serveurs faisant autorité sur une même machine, choisis
// selon l'adresse interrogée (views + match-destinations). Aucune récursion.
options {
    directory "/var/cache/bind";
    listen-on { 192.0.2.53; 192.0.2.54; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    dnssec-validation no;
    minimal-responses no-auth-recursive;
};
view "racine" {
    match-destinations { 192.0.2.53; };
    zone "." { type primary; file "/etc/bind/racine.zone"; };
};
view "tld" {
    match-destinations { 192.0.2.54; };
    zone "test." { type primary; file "/var/lib/registre/test.zone"; };
};
