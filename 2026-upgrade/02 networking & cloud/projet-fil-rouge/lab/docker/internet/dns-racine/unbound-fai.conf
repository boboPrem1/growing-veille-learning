# Le résolveur récursif du FAI de Lomé : il part de la racine du lab (indices) et descend
# la hiérarchie pour ses abonnés. Pas de DNSSEC dans cet Internet-là (pas d'ancre de confiance).
server:
    interface: 192.0.2.35
    interface: 127.0.0.1
    access-control: 192.0.2.0/24 allow
    access-control: 127.0.0.0/8 allow
    root-hints: /etc/unbound/racine.hints
    module-config: "iterator"
    # « .test » est un nom réservé (RFC 6761) : par défaut, unbound y répond lui-même NXDOMAIN
    # sans rien demander à personne. Dans l'Internet du lab, c'est notre TLD : on le résout.
    local-zone: "test." nodefault
    do-ip6: no
    # la dernière réponse négative (NXDOMAIN) est gardée jusqu'au « minimum » du SOA
    cache-max-negative-ttl: 3600
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
