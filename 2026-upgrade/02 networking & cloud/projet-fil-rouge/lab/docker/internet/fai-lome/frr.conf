! TogoNet — AS 65030, FAI de Lomé. Transit : TransAtlantique (AS 65010). Peering : TGIX (serveur
! de routes AS 65100). Il n'annonce que SES clients, à l'un comme à l'autre.
frr version 8.4
frr defaults traditional
hostname fai-lome
log syslog informational
service integrated-vtysh-config
!
ip prefix-list NOS-CLIENTS seq 5 permit 198.18.30.0/24
!
route-map VERS-AMONT permit 10
 match ip address prefix-list NOS-CLIENTS
exit
route-map VERS-AMONT deny 20
exit
! le transit : la route de dernier recours
route-map DEPUIS-TRANSIT permit 10
 set local-preference 100
exit
! le point d'échange : local, direct, gratuit — préféré
route-map DEPUIS-IXP permit 10
 set local-preference 200
exit
!
router bgp 65030
 bgp router-id 192.0.2.2
 bgp log-neighbor-changes
 neighbor 192.0.2.1 remote-as 65010
 neighbor 192.0.2.1 description transit TransAtlantique
 neighbor 198.18.1.254 remote-as 65100
 neighbor 198.18.1.254 description serveur de routes TGIX
 ! (le serveur de routes ne s'insère pas dans le chemin d'AS : ne pas exiger qu'il y soit en tête)
 no bgp enforce-first-as
 !
 address-family ipv4 unicast
  network 198.18.30.0/24
  neighbor 192.0.2.1 route-map DEPUIS-TRANSIT in
  neighbor 192.0.2.1 route-map VERS-AMONT out
  neighbor 198.18.1.254 route-map DEPUIS-IXP in
  neighbor 198.18.1.254 route-map VERS-AMONT out
 exit-address-family
exit
!
