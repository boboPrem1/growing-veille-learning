! TGIX — le serveur de routes du point d'échange de Lomé (AS 65100).
! Membres : TogoNet (AS 65030, 198.18.1.30) et Marché (AS 64500, 198.18.1.64).
! Il filtre ce que chaque membre annonce (d'après le registre) : un membre qui annoncerait le
! préfixe d'un autre (détournement, erreur de configuration) n'irait pas plus loin.
frr version 8.4
frr defaults traditional
hostname rs-ixp
log syslog informational
service integrated-vtysh-config
!
ip prefix-list MARCHE seq 5 permit 198.51.100.0/24 le 26
ip prefix-list TOGONET seq 5 permit 198.18.30.0/24
!
route-map DEPUIS-MARCHE permit 10
 match ip address prefix-list MARCHE
exit
route-map DEPUIS-MARCHE deny 20
exit
route-map DEPUIS-TOGONET permit 10
 match ip address prefix-list TOGONET
exit
route-map DEPUIS-TOGONET deny 20
exit
route-map VERS-MEMBRE permit 10
exit
!
router bgp 65100
 bgp router-id 198.18.1.254
 bgp log-neighbor-changes
 neighbor 198.18.1.30 remote-as 65030
 neighbor 198.18.1.30 description membre TogoNet
 neighbor 198.18.1.64 remote-as 64500
 neighbor 198.18.1.64 description membre Marché
 !
 address-family ipv4 unicast
  neighbor 198.18.1.30 route-server-client
  neighbor 198.18.1.30 route-map DEPUIS-TOGONET in
  neighbor 198.18.1.30 route-map VERS-MEMBRE out
  neighbor 198.18.1.64 route-server-client
  neighbor 198.18.1.64 soft-reconfiguration inbound
  neighbor 198.18.1.64 route-map DEPUIS-MARCHE in
  neighbor 198.18.1.64 route-map VERS-MEMBRE out
 exit-address-family
exit
!
