! OuestNet — AS 65020 : second transitaire. Clients : Marché (AS 64500) en Europe et à Lomé.
! Pair : TransAtlantique (AS 65010). Mêmes règles que tout transitaire sérieux : filtre des annonces
! de ses clients, jamais de routes d'un pair vers un autre pair.
frr version 8.4
frr defaults traditional
hostname transit-b
log syslog informational
service integrated-vtysh-config
!
ip prefix-list MARCHE-AGREGATS seq 5 permit 198.51.100.0/24 le 26
ip prefix-list NOS-RESEAUX seq 5 permit 198.18.2.0/24
ip prefix-list NOS-RESEAUX seq 10 permit 198.18.3.0/24
!
route-map DEPUIS-MARCHE permit 10
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map DEPUIS-MARCHE deny 20
exit
route-map VERS-CLIENT permit 10
exit
route-map DEPUIS-PAIR deny 5
 match ip address prefix-list NOS-RESEAUX
exit
route-map DEPUIS-PAIR deny 6
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map DEPUIS-PAIR permit 10
exit
route-map VERS-PAIR permit 10
 match ip address prefix-list NOS-RESEAUX
exit
route-map VERS-PAIR permit 20
 match ip address prefix-list MARCHE-AGREGATS
exit
route-map VERS-PAIR deny 30
exit
!
router bgp 65020
 bgp router-id 198.18.0.2
 bgp log-neighbor-changes
 neighbor MARCHE peer-group
 neighbor MARCHE remote-as 64500
 neighbor MARCHE description client Marché
 neighbor 198.18.2.10 peer-group MARCHE
 neighbor 198.18.3.100 peer-group MARCHE
 neighbor 198.18.0.1 remote-as 65010
 neighbor 198.18.0.1 description pair TransAtlantique
 !
 address-family ipv4 unicast
  network 198.18.2.0/24
  network 198.18.3.0/24
  neighbor MARCHE route-map DEPUIS-MARCHE in
  neighbor MARCHE route-map VERS-CLIENT out
  neighbor MARCHE maximum-prefix 20
  neighbor MARCHE soft-reconfiguration inbound
  neighbor 198.18.0.1 route-map DEPUIS-PAIR in
  neighbor 198.18.0.1 route-map VERS-PAIR out
 exit-address-family
exit
!
