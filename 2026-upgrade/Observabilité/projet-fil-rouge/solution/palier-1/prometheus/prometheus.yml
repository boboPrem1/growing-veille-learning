global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: lab

scrape_configs:
  # Prometheus se surveille lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques système de l'hôte (la VM Docker sous Windows/macOS)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: docker-host

  # Les 3 services de Marché exposent /metrics.
  # Un seul job : le label `service` distingue les cibles (et `instance` reste unique).
  - job_name: marche
    static_configs:
      - targets: ["gateway:8000"]
        labels: { service: gateway }
      - targets: ["orders:8001"]
        labels: { service: orders }
      - targets: ["payments:8002"]
        labels: { service: payments }

  # Les composants d'observabilité exposent aussi leurs propres métriques
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
