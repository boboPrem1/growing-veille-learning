# Tests unitaires des règles :  promtool test rules tests/alerts_test.yml
# (lancé depuis le dossier prometheus/, voir la CI du Palier 3)
rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml

evaluation_interval: 30s

tests:
  # 1. Une cible tombe : pending pendant 1 min, puis firing
  - interval: 30s
    input_series:
      - series: 'up{job="app", instance="marche-payments:8002", service="payments"}'
        values: "1 1 0 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: CibleInjoignable
        exp_alerts: []
      - eval_time: 2m30s
        alertname: CibleInjoignable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: app
              instance: marche-payments:8002
              service: payments
            exp_annotations:
              summary: "app / marche-payments:8002 ne répond plus"
              description: "Prometheus n'arrive plus à scraper marche-payments:8002 depuis plus d'une minute."
              runbook_url: "https://git.marche.local/observabilite/runbooks#cibleinjoignable"

  # 2. 10 % d'erreurs sur orders pendant 10 min → alerte ; gateway sain → pas d'alerte
  - interval: 30s
    input_series:
      # +20 requêtes/30 s dont +2 en 5xx
      - series: 'http_requests_total{job="app", service="orders", method="POST", route="/orders", status="201"}'
        values: "0+18x20"
      - series: 'http_requests_total{job="app", service="orders", method="POST", route="/orders", status="502"}'
        values: "0+2x20"
      - series: 'http_requests_total{job="app", service="gateway", method="GET", route="/api/products", status="200"}'
        values: "0+20x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: TauxErreursEleve
        exp_alerts:
          - exp_labels:
              severity: critical
              service: orders
            exp_annotations:
              summary: "orders : 10% de réponses 5xx"
              description: "Plus de 5 % des requêtes de orders échouent depuis 2 minutes."
              runbook_url: "https://git.marche.local/observabilite/runbooks#tauxerreurseleve"

  # 3. La recording rule de ratio calcule bien 10 %
  - interval: 30s
    input_series:
      - series: 'http_requests_total{job="app", service="orders", method="POST", route="/orders", status="201"}'
        values: "0+18x20"
      - series: 'http_requests_total{job="app", service="orders", method="POST", route="/orders", status="502"}'
        values: "0+2x20"
    promql_expr_test:
      - expr: service:http_requests_errors:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'service:http_requests_errors:ratio_rate5m{service="orders"}'
            value: 0.1

  # 4. Plus aucune commande payée : l'alerte « silence suspect » se déclenche
  - interval: 1m
    input_series:
      - series: 'marche_orders_total{payment_method="card", status="paid"}'
        values: "0+5x10 50x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: AucuneCommandePayee
        exp_alerts: []
      - eval_time: 27m
        alertname: AucuneCommandePayee
        exp_alerts:
          - exp_labels:
              severity: critical
              service: orders
            exp_annotations:
              summary: "Aucune commande payée depuis 15 minutes"
              runbook_url: "https://git.marche.local/observabilite/runbooks#aucunecommandepayee"
