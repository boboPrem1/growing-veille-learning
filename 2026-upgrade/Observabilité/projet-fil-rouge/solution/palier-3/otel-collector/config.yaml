# OpenTelemetry Collector (distribution contrib) — point d'entrée unique des traces.
# Les applications n'envoient qu'ici (OTLP) ; le Collector route vers le(s) backend(s).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Toujours en PREMIER : refuse les données plutôt que de se faire tuer par l'OOM killer
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Enrichit chaque span avec des attributs de ressource communs
  resource:
    attributes:
      - key: deployment.environment.name
        value: lab
        action: upsert
  # Toujours en DERNIER : regroupe les envois (moins de requêtes, meilleure compression)
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true        # réseau Docker interne ; mTLS en production (voir cours §sécurité)
  debug:
    verbosity: basic         # une ligne de résumé par lot dans les logs du Collector

service:
  extensions: [health_check]
  telemetry:
    # Le Collector expose ses propres métriques (scrapées par Prometheus)
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_grpc/tempo]
