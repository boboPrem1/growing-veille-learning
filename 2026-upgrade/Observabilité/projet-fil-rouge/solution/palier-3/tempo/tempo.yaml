# Grafana Tempo 3 — mode monolithique (single binary), stockage local.
# Tempo 3 : plus d'ingesters ; en single binary, le distributor écrit directement dans le
# live-store et le metrics-generator (sans Kafka).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Génère des MÉTRIQUES à partir des traces et les pousse vers Mimir :
#  - service-graphs : qui appelle qui, avec débit/erreurs/latence → « Service map » dans Grafana
#  - span-metrics   : RED par span (traces_spanmetrics_*)
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
